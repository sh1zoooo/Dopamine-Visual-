name: Build Dopamine Visual (Fake) IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Dopamine.xcodeproj \
            -scheme Dopamine \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log
          tail -n 200 build.log

      - name: Post build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build.log ]; then
            jq -Rs '{body: ("Build log (tail):\n```\n" + .[-55000:] + "\n```")}' build.log > /tmp/comment.json
          else
            echo '{"body":"No build.log was produced."}' > /tmp/comment.json
          fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/comment.json

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Dopamine.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            find build -maxdepth 6 -iname "*.app"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Dopamine.app
          # ad-hoc / fake-sign so eSign-style tools can re-sign it
          /usr/bin/codesign --force --deep -s - Payload/Dopamine.app || true
          zip -qr Dopamine-Visual-Fake.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-Visual-Fake
          path: Dopamine-Visual-Fake.ipa
